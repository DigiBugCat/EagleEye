name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaglegaze-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, macOS, ARM64, duck, native-ios, eaglegaze]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Require native build disk headroom
        shell: bash
        run: |
          minimum_available_kib=10485760
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          if [ -z "$available_kib" ] || [ "$available_kib" -lt "$minimum_available_kib" ]; then
            echo "Duck needs at least 10 GiB free before starting native verification." >&2
            df -h "$RUNNER_TEMP" >&2
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test GazeCore
        run: swift test --package-path Packages/GazeCore

      - name: Build macOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazeMac
          -destination 'platform=macOS'
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazePhone
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Shut down runner-owned simulators
        if: always()
        run: xcrun simctl shutdown all || true
