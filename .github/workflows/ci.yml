name: CI

on:
  # This private repository's write-access list is the trust boundary for Duck.
  # Every branch push runs CI; fork pull-request code does not run independently.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eaglegaze-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: [self-hosted, macOS, ARM64, duck, native-ios, eaglegaze]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Require native build disk headroom
        shell: bash
        run: |
          minimum_available_kib=10485760
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print $4 }')"
          if [ -z "$available_kib" ] || [ "$available_kib" -lt "$minimum_available_kib" ]; then
            echo "Duck needs at least 10 GiB free before starting native verification." >&2
            df -h "$RUNNER_TEMP" >&2
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Bun for VoiceOS verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: VoiceOS/.bun-version

      - name: Verify VoiceOS integration
        working-directory: VoiceOS
        run: |
          bun install --frozen-lockfile
          bun run verify

      - name: Test GazeCore
        run: swift test --package-path Packages/GazeCore

      - name: Build macOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazeMac
          -destination 'platform=macOS'
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazePhone
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      # Duck runs headlessly and has no per-login com.apple.testmanagerd
      # service. Build the hosted XCTest bundle here; the same scheme is
      # executed on a logged-in Mac in the local release gate.
      - name: Build macOS test modules
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazeMac
          -destination 'platform=macOS,arch=arm64'
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          simulator_udid="$({ xcrun simctl list devices available -j; } | /usr/bin/python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          available = [
              device
              for runtime in devices.values()
              for device in runtime
              if device.get("isAvailable")
          ]
          selected = next(
              (device for device in available if device.get("state") == "Booted"),
              next((device for device in available if "iPhone" in device.get("name", "")), None),
          )
          if selected is None:
              raise SystemExit("no available iOS simulator")
          print(selected["udid"])
          ')"
          if [ -z "$simulator_udid" ]; then
            echo "Duck has no available iPhone simulator runtime." >&2
            exit 1
          fi
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "EAGLEGAZE_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Test iPhone app modules
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazePhone
          -destination "platform=iOS Simulator,id=$EAGLEGAZE_SIMULATOR_UDID"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Shut down runner-owned simulators
        if: always()
        run: xcrun simctl shutdown all || true
