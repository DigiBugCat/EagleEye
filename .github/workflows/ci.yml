name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eagleeye-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Bun for VoiceOS verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: VoiceOS/.bun-version

      - name: Verify VoiceOS integration
        working-directory: VoiceOS
        run: |
          bun install --frozen-lockfile
          bun audit --prod
          bun run verify

      - name: Test GazeCore
        run: swift test --package-path Packages/GazeCore

      - name: Test GazeCropKit
        run: swift test --package-path Packages/GazeCropKit

      - name: Build macOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazeMac
          -destination 'platform=macOS'
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build iOS app
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazePhone
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test macOS app modules
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazeMacTests
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          destinations="$(xcodebuild -project EagleGaze.xcodeproj -scheme EagleGazePhoneTests -showdestinations)"
          simulator_udid="$(sed -nE 's/.*platform:iOS Simulator, arch:[^,]+, id:([^,]+),.*/\1/p' <<< "$destinations" | head -1 | tr -d ' ')"
          if [ -z "$simulator_udid" ]; then
            echo "The runner has no iPhone simulator accepted by the EagleGazePhoneTests scheme." >&2
            echo "$destinations" >&2
            exit 1
          fi
          xcrun simctl boot "$simulator_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "EAGLEGAZE_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Test iPhone app modules
        run: >-
          xcodebuild
          -project EagleGaze.xcodeproj
          -scheme EagleGazePhoneTests
          -destination "platform=iOS Simulator,id=$EAGLEGAZE_SIMULATOR_UDID"
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Shut down runner-owned simulators
        if: always()
        run: xcrun simctl shutdown all || true
